name: auto-update-software-map
on:
  push:
    branches:
     - main
     - mcobb/auto-update
  workflow_dispatch:

jobs:
  auto-update:
    runs-on: the-capable-hub-aws-ci
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Install Github CLI
        shell: bash
        run: |
          type -p yum-config-manager >/dev/null || sudo yum install yum-utils
          sudo yum-config-manager --add-repo https://cli.github.com/packages/rpm/gh-cli.repo
          sudo yum -y install gh

      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          path: "software-map"

      - name: Checkout Auto Updater
        uses: actions/checkout@v4
        with:
          repository: "michaelcobb-capablehub/auto-update-software-map"
          fetch-depth: 1
          path: "auto-updater"

      - name: Setup Auto Updater
        shell: bash
        working-directory: ./auto-updater
        run: |
          # Create python3 venv and install requirements:
          python3 -m venv ./venv
          . ./venv/bin/activate
          python3 -m pip install -r requirements.txt

      - name: Run Auto Updater
        shell: bash
        working-directory: ./auto-updater
        run: |
          . ./venv/bin/activate
          ./main.py ${GITHUB_WORKSPACE}/software-map/qemu.yaml
          #touch $GITHUB_WORKSPACE/software-map/foo.yaml

      - name: Determine if there are changes
        id: determine_changes
        shell: bash
        working-directory: ./software-map
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -n $(git status -s -uall) ]]; then
            echo "::set-output name=CREATE_PR::true"
          fi

      - name: Commit changes
        if: ${{ steps.determine_changes.outputs.CREATE_PR == 'true' }}
        shell: bash
        working-directory: ./software-map
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="auto-updater/${{github.run_id}}_${{github.run_attempt}}"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

          # set up git
          git config user.name "github-actions[bot]"
          git config user.email "example@example.com"

          echo "Pushing to branch: '${BRANCH_NAME}'..."
          # Create PR branch
          git checkout -b ${BRANCH_NAME}
          git add *.yaml
          git commit -m "Auto update software map"
          git push --set-upstream origin ${BRANCH_NAME}

      - name: Create PR
        if: ${{ steps.determine_changes.outputs.CREATE_PR == 'true' }}
        shell: bash
        working-directory: ./software-map
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create the PR
          gh pr create \
            --title "Auto update software map" \
            --body "Pull request body" \
            --base mcobb/auto-update \
            --head ${BRANCH_NAME}
