name: auto-update-software-map
on:
  push:
    branches:
     - main
     - mcobb/auto-update
  workflow_dispatch:

jobs:
  auto-update:
    runs-on: the-capable-hub-aws-ci
    steps:
      - name: Checkout auto updater
        uses: actions/checkout@v4
        with:
          path: "software-map"

      - name: Checkout Auto Updater
        uses: actions/checkout@v4
        with:
          repository: "michaelcobb-capablehub/auto-update-software-map"
          fetch-depth: 1
          path: "auto-updater"

      - name: Act workaround
        if: ${{ env.ACT }}
        shell: bash
        run: |
          #mkdir /home/ubuntu/.ssh && curl --silent https://api.github.com/meta | jq --raw-output '"github.com "+.ssh_keys[]' >> /home/ubuntu/.ssh/known_hosts
          #mkdir -p /home/ubuntu/.ssh
          #ssh-keyscan -t ed25519 github.com >> /home/ubuntu/.ssh/known_hosts
          #chmod 600 /home/ubuntu/.ssh/known_hosts
          :

      - name: Setup Auto Updater
        shell: bash
        run: |
          cd ${GITHUB_WORKSPACE}/auto-updater
          # Create python3 venv and install requirements:
          python3 -m venv ./venv
          . ./venv/bin/activate
          python3 -m pip install -r requirements.txt

      - name: Run Auto Updater
        shell: bash
        run: |
          cd ${GITHUB_WORKSPACE}/auto-updater
          . ./venv/bin/activate
          
          ./main.py ${GITHUB_WORKSPACE}/software-map/qemu.yaml

          #mv qemu.yaml.new $GITHUB_WORKSPACE/software-map/qemu.yaml
          #touch $GITHUB_WORKSPACE/software-map/foo.yaml.new

      - name: Commit changes
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ${GITHUB_WORKSPACE}/software-map
          BRANCH_NAME="auto-updater/$(date +"%Y-%m-%d-%H-%m-%S")"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

          # set up git
          git config user.name "github-actions[bot]"
          git config user.email "example@example.com"

          ### DEBUG
          #git remote set-url origin git@github.com:The-Capable-Hub/software-map.git
          ## DEBUG

          # Create PR branch
          git checkout -b ${BRANCH_NAME}
          git add *.yaml
          #git add *.yaml.new
          git commit -m "Auto update software map"
          git push --set-upstream origin ${BRANCH_NAME}

      - name: Create PR
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ${GITHUB_WORKSPACE}/software-map
           Create the PR
          gh pr create \
            --title "Auto update software map" \
            --body "Pull request body" \
            --base mcobb/auto-update \
            --head ${BRANCH_NAME}
