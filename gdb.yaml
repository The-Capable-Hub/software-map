project_summary:
  category: "tools"
  home_text: "_There are multiple homes for this project, see the [Get Involved](#get-involved) section._"
  short_description: "CHERI-enabled fork of GDB"
  description: |-
    [GNU Debuger](https://www.sourceware.org/gdb/) is a portable debug utility that can run/attach to other processes and inspect but also control how these processes (and their children) are accessing the system memory and how the code ends up in and interacts with the hardware registers. The tool can understand assembly and higher level languages and in general is very good for tracing application execution in real time.

  status: |-
    There are three repositories for GDB, each historically adding support for different architectures, the first development work was done for the University of Cambridge RISC-V architecture (currently at ISAv9) at  [https://github.com/CTSRD-CHERI/gdb](https://github.com/CTSRD-CHERI/gdb) and is currently at version 14.1 of GDB.
    The `cheri-14` branch supports RISC-V ISAv9 userspace CheriBSD and bare-metal binaries and Morello user space for bare-metal, CheriBSD and Linux. The `cheri-14-kgdb` branch also supports CheriBSD kernel for both RISC-V and Morello. This repository replaced the initial and canonical GBD Morello from ARM which is now very old (version 11.0.5).

    The GDB for Morello at [https://git.morello-project.org/morello/binutils-gdb](https://git.morello-project.org/morello/binutils-gdb) lives in a vendor branch [upstream](https://sourceware.org/git/?p=binutils-gdb.git;a=shortlog;h=refs/heads/users/ARM/morello-binutils-gdb-master) and as already mentioned is at version 11.0.5, this project was based of an older implementation of GDB from the CTSRD-CHERI repository.

    The GDB hosted at the Cherry Aliance repository [https://github.com/CHERI-Alliance/gdb](https://github.com/CHERI-Alliance/gdb) is really a fork off the UoC repository from [October 2024](https://github.com/CHERI-Alliance/gdb/commit/7c05fb82db7ddd8e009548b8e853657c3512029f) and Codasip has added support for the RISC-V RVY architecture along with bug fixes on top of the previous work at UoC, it is also at version 14.1.


  vulnerability_contact: "support@thecapablehub.org"
  download_notes: "There are no pre-built binaries or versioned releases, users must build from source."
  last_update: "2nd February 2026"

project_contribution:
  src_tree: |-
    - [CHERI-Alliance/gdb](https://github.com/CHERI-Alliance/gdb) - 14.1
    - [CTSRD-CHERI/gdb](https://github.com/CTSRD-CHERI/gdb) - 14.1
    - [Morello](https://git.morello-project.org/morello/binutils-gdb) - 11.0.5
  chat: |-
    There is a dedicated Slack channel at the [CHERI CPU Slack](https://www.cl.cam.ac.uk/research/security/ctsrd/cheri/cheri-slack.html) in the `#debuggers` channel.
  mailing_lists: |-
    There are no mailing lists associated with this project.
  meetings: |-
    There are no regular meetings associated with this project.

buildingFromSource: "Please keep an eye out for our [blog](/blog/) as we will soon share instructions for building from source."

