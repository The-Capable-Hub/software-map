project_summary:
  category: "library"
  home_url: "https://developer.arm.com/documentation/109399/10-1-Morello-Alp2-2022_11/"
  short_description: "CHERI-enabled forks of glibc"
  description: |-
    The GNU C Library (glibc), is the GNU Project implementation of the C standard library. 
    It provides a wrapper around the system calls of kernels for application use.
  status: |-
    There have been no releases of Morello GNU toolchain (incl glibc) in a long time. It is currently unmaintained and lagging behind upstream.

    There were some updates to the [Morello glibc branch](https://sourceware.org/git/?p=glibc.git;a=shortlog;h=refs/heads/arm/morello/main) in 2023 but these are not included in any official releases.

  last_update: "3rd February 2026" 

project_contribution:
  src_tree: |-
    [glibc repository](https://sourceware.org/git/?p=glibc.git;a=shortlog;h=refs/heads/arm/morello/main)
  chat: |-
    Use the [Morello forum](https://community.arm.com/support-forums/f/morello-forum) for general support.
  mailing_lists: |-
    For generic queries send and email to [linux-morello@op-lists.linaro.org](mailto:linux-morello@op-lists.linaro.org)
  meetings: |-
    There are no regular meetings for this

buildingFromSource: |-
  Instructions on building glibc from source can be found in the [Morello GNU toolchain docs](https://sdk.morello-project.org/docs/gnu/) as well as the Release Notes for each release.
  
software:
