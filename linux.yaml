project_summary:
  category: "kernel"
  home_url: https://github.com/CHERI-Alliance/linux/
  # home_text: This can be used to provide text if there isn't one home.
  short_description: "CHERI enabled Linux kernel"
  description: |-
    Linux is a free, open-source kernel that serves as the core foundation for a wide variety of operating systems used on everything from servers to smartphones.
    The CHERI forks enhance this foundation by replacing traditional pointers with hardware-enforced capabilities, providing fine-grained memory safety and compartmentalisation.
  status: |-
    Towards the end of 2025, RISC-V support for CHERI Linux by Codasip was open-sourced and published via [CHERI-Alliance/linux](github.com/CHERI-Alliance/linux/) repo.
    These patches are based on the upstream [Linux Kernel](https://github.com/torvalds/linux/), and the CHERI modifications made by the [ARM Morello project](https://git.morello-project.org/morello/kernel/linux).

    The CHERI-enabled RISC-V kernel uses the CHERI enabled purecap UABI and the kernel itself also runs in capability mode.
    Support for legacy non-CHERI aware userspace programs is currently incomplete (some driver ioctls are still missing), but running some unmodified binaries is possible as of 6.18.

    The code is under continued active development and the history is not guaranteed. Please expect rebases and history re-writes.

  # vulnerability_contact: "support@thecapablehub.org"
  last_update: "27th January 2026"
  download_notes: "Please note that there are no build artifacts, please see instructions for building from source."

project_contribution:
  src_tree: |-
    - [CHERI-Alliance/linux](https://github.com/CHERI-Alliance/linux/)
    - [morello/linux](https://git.morello-project.org/morello/kernel/linux)
  mailing_lists: |-
    - [linux-kernel](https://lists.cheri-alliance.org/mailman3/postorius/lists/linux-kernel.cheri-alliance.org/) CHERI Alliance working group mailing list
  slack: |-
    Support for CHERI Linux is provided via the [CHERI CPU Slack](https://www.cl.cam.ac.uk/research/security/ctsrd/cheri/cheri-slack.html).
      - #cheri-linux: The main channel for linux
  meetings: |-
    The CHERI Alliance [Linux working group](https://cheri-alliance.org/who-we-are/working-groups/cheri-linux/) hold regular meetings

buildingFromSource: |-
  For instructions on building the RISC-V CHERI-Linux from source, check out our blog post on [Getting started with CHERI Linux on RISC-V](/blog/cheri-linux-getting-started/)

  For Morello, see the [morello-project.org](https://linux.morello-project.org/) documentation on how to get started.

software:
  # CHERI Alliance repo
  - arch: "riscv64c"
    releases:
     - version: "codasip-cheri-riscv"
       version_date: 2026-01-26
       latest: true
       version_url: "https://github.com/CHERI-Alliance/linux/tree/codasip-cheri-riscv-6.18"
       upstream_version: "6.18"
       upstream_date: 2025-11-30
       upstream_url: "https://github.com/torvalds/linux/commit/7d0a66e4bb9081d75c82ec4957c50034cb0ea449"
       cheri_spec:
        - name: CHERI RISC-V
          version: 0.9.3
       images:
         - label: "Source"
           link: "https://github.com/CHERI-Alliance/linux/tree/codasip-cheri-riscv-6.18"

  # Morello Master
  - arch: "aarch64, aarch64c"
