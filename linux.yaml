       upstream_date: 2024-01-07
       upstream_url: "https://github.com/torvalds/linux/commit/0dd3ee31125508cd67f7e7172247f05b7fd1753a"
       cheri_spec:
          - name: "ARM Morello"
            version: "A.k"
       images:
         - label: "Source"
