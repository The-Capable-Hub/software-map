project_summary:
  category: "toolchain"
  # home_url: Omitted as there are multiple. Using home_text instead
  home_text: "_There are multiple homes, see the [Get Involved](#get-involved) section for more info._"
  short_description: "Fork of LLVM adding CHERI support "
  description: |- 
    LLVM is a collection of modular and reusable compiler and toolchain technologies.
    These forks integrate CHERI support into LLVM (e.g `clang` and `lld`), enabling the creation of memory-safe software for Morello and RISC-V architectures.
  status: |-
    As of 2026 there are multiple supported CHERI reference architectures. Each with their own repositories where development takes place.
    | Reference Architecture | Development Repository |
    | :--- | :--- |
    | ARM Morello Prototype | [Morello llvm-project](https://git.morello-project.org/morello/llvm-project) |
    | University of Cambridge RISC-V ISA v9 | [CTSRD llvm-project](https://github.com/CTSRD-CHERI/llvm-project) |
    | CHERI RISC-V Draft Standard 0.9.3 | [CHERI Alliance llvm-project](https://github.com/CHERI-Alliance/llvm-project) |
    | CHERIoT ISA v1.0 | [CHERIoT llvm-project](https://github.com/CHERIoT-Platform/llvm-project) |

  # vulnerability_contact: "support@thecapablehub.org"
  last_update: "22nd January 2025"

project_contribution:
  src_tree: |-
    - [Morello llvm-project](https://git.morello-project.org/morello/llvm-project)
    - [The University of Cambridge llvm-project repo](https://github.com/CTSRD-CHERI/llvm-project)
    - [CHERI Alliance LLVM Repo](https://github.com/CHERI-Alliance/llvm-project)
    - [CHERIot llvm-project](https://github.com/CHERIoT-Platform/llvm-project)
  mailing_lists: |-
    There is no direct LLVM mailing list.
  slack: |-
    Support for CHERI LLVM is provided via the [CHERI CPU Slack](https://www.cl.cam.ac.uk/research/security/ctsrd/cheri/cheri-slack.html).
      - #cheri-llvm: The main channel for llvm 
  meetings: |-
    There are no public meetings for this project

buildingFromSource: |-
  Instructions for building from source depend on which reference specification you are targeting.
  
  CTSRD and Morello versions are built using the [`cheribuild.py`](https://github.com/CTSRD-CHERI/cheribuild) script.
  Please refer to `cheribuild.py` usage for help.

  The CHERI Alliance LLVM does not have formal build instructions.
  Checkout the [Building LLVM](/blog/cheri-linux-getting-started/#building-llvm) section in our blog post on [Getting started with CHERI Linux on RISC-V](/blog/cheri-linux-getting-started/#building-llvm), as we cover it there.

  Instructions on building CHERIoT LLVM can be found in their [Getting Started Guide](https://github.com/CHERIoT-Platform/cheriot-rtos/blob/main/docs/GettingStarted.md#building-cheriot-llvm).

