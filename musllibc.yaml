project_summary:
  category: "library"
  home_text: "_There are multiple homes, see the [Get Involved](#get-involved) section for more info._"
  short_description: "CHERI-enabled forks of musl libc"
  description: |-
    Musl libc is a lightweight, high-performance implementation of the C standard library designed for use in Linux-based operating systems.
    It aims to provide a clean, modern codebase that eliminates the bloat and complex overhead often found in traditional library implementations.
  status: |-
    The last official release of musl libc for the Morello platform was in 2024, but since then there have been sporadic updates to the master branch with various fixes.

    Codasip's work to add support for RVY (CHERI-RISC-V) to musl libc has recently been open-sourced, and is now available on the CHERI-Alliance Github.
    This version is based on the Morello musl libc, and the work to unify development of both streams in the CHERI-Alliance repo is ongoing.
    This approach is to avoid fragmentation and duplication of effort.

    Both of these versions are based on upstream musl libc 1.2.4.
    The latest upstream release is 1.2.5, which was released February 29th 2024.

    RVY support in musl libc will enable RISC-V RVY Linux userspace to be able to be compiled with cheribuild. You can track the progress of cheribuild support [here](https://github.com/CTSRD-CHERI/cheribuild/pull/451).

  last_update: "3rd February 2026"
  download_notes: "There are no pre-built binaries or versioned releases yet, users must build from source."

project_contribution:
  src_tree: |-
    - [morello/musl-libc](https://git.morello-project.org/morello/musl-libc)
    - [CHERI-Alliance/musl](https://github.com/CHERI-Alliance/musl)
  chat: |-
    Support is generally discussed in the [CHERI CPU Slack](https://www.cl.cam.ac.uk/research/security/ctsrd/cheri/cheri-slack.html).
  meetings: |-
    There are no regular meetings for these projects

buildingFromSource: |-
  The [morello/musl-libc](https://git.morello-project.org/morello/musl-libc) has instructions on how to build the latest version from source.

  Full instructions on how to build the [CHERI-Alliance/musl](https://github.com/CHERI-Alliance/musl) version can be found in the project's [README](https://github.com/CHERI-Alliance/musl/blob/codasip-cheri-riscv/README.md).

