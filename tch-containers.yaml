project_summary:
  category: "tools"
  home_url: "https://github.com/The-Capable-Hub/tch-containers"
  #home_text: Use home_url in this case
  short_description: "Container images for CHERI tools"
  description: |-
    The [tch-containers](https://github.com/The-Capable-Hub/tch-containers) repository contains the Dockerfiles used to build The Capable Hub's published docker containers for various CHERI tools/projects.
    Containers are published on the `capablehub` [Dockerhub](https://hub.docker.com/u/capablehub) organisation.

    The hub publishes re-usable containers for:
    - [seL4](https://github.com/The-Capable-Hub/tch-containers/blob/main/seL4/Dockerfile) - SDK environment for cheri microkit baremetal riscv64 purecap
    - [morello-yocto](https://github.com/The-Capable-Hub/tch-containers/blob/main/yocto/Dockerfile-morello) - Build container with environment setup for building with kas
    - [Zephyr](https://github.com/The-Capable-Hub/tch-containers/blob/main/zephyr) - CHERI-Zephyr SDK configured for building Zephyr applications targetting CHERI Alliance 0.9.3 spec or CTSRD ISAv9
    - [LLVM](https://github.com/The-Capable-Hub/tch-containers/blob/main/llvm) - CHERI Alliance 0.9.3 or CTSRD ISAv9 builds of the LLVM toolchain

  status: |-

    The initial goals of the tch-containers repository are:
      - Create Dockerfiles suitable for re-use within CI environments - For time optimising CI usage
      - Assist CHERI projects to create SDKs - To pull together complete sets of tools.

    The hope is to be able to host & support a collection of CHERI containers that can be re-used to build other tools.
    The first steps towards this are in the [CHERI-Zephyr](https://github.com/The-Capable-Hub/tch-containers/tree/main/zephyr) containers, where they now [re-use the LLVM containers](https://github.com/The-Capable-Hub/tch-containers/blob/e11c6683aa5fbfb24b0b4950861deff8c8b64886/zephyr/Dockerfile#L132).

  vulnerability_contact: "support@thecapablehub.org"
  #download_notes: N/A
  last_update: "29th January 2026"

project_contribution:
  src_tree: |-
    - [The-Capable-Hub/tch-containers](https://github.com/The-Capable-Hub/tch-containers)
  chat: |-
    Feel free to create an Issue or open a PR with any comments / changes
  mailing_lists: |-
      - [cheri-discuss](https://www.thecapablehub.org/docs/mailinglists/) - For general CHERI related discussion
  meetings: |-
    There are no regular meetings for this project.

buildingFromSource: "Instructions on how to build the containers yourself can be found in each subfolders README."

