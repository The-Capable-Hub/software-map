project_summary:
  category: "bootloader"
  home_url: "https://github.com/CHERI-Alliance/u-boot"
  short_description: "CHERI-enabled fork of the Das U-Boot bootloader"
  description: "CHERI-enabled fork of the Das U-Boot bootloader: A versatile, feature-rich bootloader supporting a wide range of architectures and embedded devices."
  status: |-
    Active development takes place in the [CHERI-Alliance/u-boot repository](https://github.com/CHERI-Alliance/u-boot) on the codasip-cheri-riscv branch.
  vulnerability_contact: "support@thecapablehub.org"
  download_notes: "There are no pre-built binaries or versioned releases."
  last_update: "28th January 2026"

project_contribution:
  src_tree: |-
    The active repository is [CHERI-Alliance/u-boot](https://github.com/CHERI-Alliance/u-boot) on the codasip-cheri-riscv branch.

    Earlier work can be found in [CTSRD-CHERI/u-boot](https://github.com/CTSRD-CHERI/u-boot), however this is unmaintained (no development since 2021) and should not be used. The repository includes support for CHERI-MIPS (an architecture no longer maintained), Morello (which was never used) and an unfinished branch to support CHERI-RISC-V.
  slack: |-
    There are no dedicated Slack channels, however support may be available in the [CHERI CPU Slack](https://www.cl.cam.ac.uk/research/security/ctsrd/cheri/cheri-slack.html) in the `#general` channel.
  mailing_lists: |-
    There are no mailing lists associated with this project.
  meetings: |-
    There are no regular meetings associated with this project.

buildingFromSource: "Please keep an eye out for our [blog](/blog/) as we will soon share instructions for building from source."

project_versions:
  version_methods:
  - method: "match_file"
    version_type: "semantic"
    args:
    - "Makefile"
    - - "^VERSION = (?P<major>\\d+)"
      - "^PATCHLEVEL = (?P<minor>\\d+)"
      - "^SUBLEVEL = (?P<patch>\\d+)"
      - "^EXTRAVERSION = (?P<extra>[\\w\\-]+)"
  - method: "latest_matching_tag"
    version_type: "semantic"
    args:
    - "^refs/tags/v(?P<major>\\d+)\\.(?P<minor>\\d+)(\\.(?P<patch>\\d+))?(-(?P<extra>[\\w\\-]+))?"

